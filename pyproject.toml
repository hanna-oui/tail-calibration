[project]
name = "tail-calibration"
version = "0.1.0"
description = "Python implementation of tail calibration for probabilistic forecasts, with an application to FluSight influenza hospitalization forecasts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "scoringrules>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
